transport:
  type: native
  poll_seconds: 30
  offline_after_failures: 3
mqtt:
  host: 127.0.0.1
  port: 1883
  base_topic: york/ac2
  discovery_prefix: homeassistant
device:
  name: York AC2
  unique_id: york_ac2
logging:
  level: INFO

# Native authoritative state source. Use the York module values from the
# physically verified Alpha.58 configuration.
direct_read:
  enabled: false
  # Replace these documentation-only values before enabling.
  host: 192.0.2.1
  mac: "02:00:00:00:00:01"
  port: 80
  timeout_seconds: 3
  poll_seconds: 30

# Guarded normal-control pilot. Disabled by default. `enabled` permits qualified
# temperature-only writes, including the whole-degree Heat/High/Vertical path
# physically qualified through Alpha.40. `power_enabled` separately permits
# the six exact power/mode cases qualified through Alpha.37. Any ineligible
# state, combined request, or direct failure is rejected without fallback.
direct_control:
  enabled: false
  power_enabled: false
  post_write_delay_seconds: 2

# Sprint 2.3 development diagnostics. These options never change the active
# transport and do not send packets unless probe_on_startup is explicitly enabled
# and a validated state_request_hex is configured.
debug:
  enabled: false
  native_compare: false
  publish_raw_frames: false
  probe_on_startup: false
  probe_interval_seconds: 60
  capture_directory: /reports/native-probes
