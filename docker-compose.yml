services:
  york-hybrid-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: york-hybrid-bridge
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Australia/Melbourne}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.yml:/config/config.yml:ro
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
