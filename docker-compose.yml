services:
  climate-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: climate-bridge
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config.yml:/config/config.yml:ro
      - type: bind
        source: ./qualification-reports
        target: /reports
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
