name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set release variables
        shell: bash
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=York-Hybrid-Bridge-${GITHUB_REF_NAME}.zip" >> "$GITHUB_ENV"

      - name: Build release archive
        shell: bash
        run: |
          zip -r "$ARCHIVE_NAME" .             -x ".git/*"                ".github/*"                ".pytest_cache/*"                "__pycache__/*"                "*/__pycache__/*"                "*.pyc"                ".env"                "*.log"

      - name: Generate checksum
        shell: bash
        run: sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: York Hybrid Bridge ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
