name: Bug Report
description: Report a bug or unexpected behaviour without publishing sensitive evidence.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste raw logs, captures, credentials, tokens, device identifiers, network addresses, or other private material. Include only sanitized facts and opaque references to approved private evidence. An issue does not authorize live testing or device commands.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what was the expected result?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction context
      description: List offline steps only. Link a separately approved controlled record for any physical or live work.
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Exact source identity
      description: Full commit SHA and reported Climate Bridge version.
      placeholder: "<40-character SHA> / 1.0.0"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Offline verification and sanitized evidence
      description: Commands/results, limitations, and opaque evidence references. Do not include raw private material.
    validations:
      required: true
  - type: checkboxes
    id: controls
    attributes:
      label: Safety confirmation
      options:
        - label: I removed sensitive identifiers and raw private evidence.
          required: true
        - label: I understand this issue does not authorize live HVAC commands, capture, deployment, or physical qualification.
          required: true
  - type: textarea
    id: additional
    attributes:
      label: Limitations and additional context
