name: Bug Report
description: Report a bug or unexpected behaviour.
title: "[Bug]: "
labels:
  - bug

  
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve York Hybrid Bridge.

  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: What happened?
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: York Hybrid Bridge Version
      placeholder: v3.0.0
    validations:
      required: true

  - type: input
    id: ha
    attributes:
      label: Home Assistant Version
      placeholder: 2026.x.x

  - type: input
    id: docker
    attributes:
      label: Docker Version
      placeholder: Optional

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
